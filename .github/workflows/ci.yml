name: Sunrise Dental Clinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check Java version
        run: java -version

      - name: Download Jakarta Servlet API
        run: |
          mkdir -p ci/lib

          curl -L -o ci/lib/jakarta-servlet-api.jar \
            https://repo1.maven.org/maven2/jakarta/servlet/jakarta.servlet-api/6.0.0/jakarta.servlet-api-6.0.0.jar

      - name: Download Jakarta Mail dependencies
        run: |
          curl -L -o ci/lib/jakarta.mail-api.jar \
            https://repo1.maven.org/maven2/jakarta/mail/jakarta.mail-api/2.1.3/jakarta.mail-api-2.1.3.jar

          curl -L -o ci/lib/jakarta.activation-api.jar \
            https://repo1.maven.org/maven2/jakarta/activation/jakarta.activation-api/2.1.3/jakarta.activation-api-2.1.3.jar

          curl -L -o ci/lib/angus-mail.jar \
            https://repo1.maven.org/maven2/org/eclipse/angus/angus-mail/2.0.4/angus-mail-2.0.4.jar

          curl -L -o ci/lib/angus-activation.jar \
            https://repo1.maven.org/maven2/org/eclipse/angus/angus-activation/2.0.2/angus-activation-2.0.2.jar

      - name: Download MySQL Connector
        run: |
          curl -L -o ci/lib/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.4.0/mysql-connector-j-9.4.0.jar

      - name: Compile Java source
        run: |
          mkdir -p build/classes

          find src/main/java -name "*.java" > sources.txt

          javac \
            -cp "ci/lib/*" \
            -d build/classes \
            @sources.txt

      - name: Download JUnit 5 Console Launcher
        run: |
          curl -L -o ci/lib/junit-platform-console-standalone.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar

      - name: Compile JUnit tests
        run: |
          mkdir -p build/test-classes

          find src/test/java -name "*.java" > test-sources.txt

          javac \
            -cp "build/classes:ci/lib/*" \
            -d build/test-classes \
            @test-sources.txt