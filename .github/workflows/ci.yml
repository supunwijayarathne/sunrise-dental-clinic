name: Sunrise Dental Clinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout project
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Check Java version
      - name: Check Java version
        run: java -version

      # 4. Create CI library directory
      - name: Create CI library directory
        run: mkdir -p ci/lib

      # 5. Download Jakarta Servlet API
      - name: Download Jakarta Servlet API
        run: |
          curl -fL -o ci/lib/jakarta-servlet-api.jar \
            https://repo1.maven.org/maven2/jakarta/servlet/jakarta.servlet-api/6.0.0/jakarta.servlet-api-6.0.0.jar

      # 6. Download Jakarta Mail dependencies
      - name: Download Jakarta Mail dependencies
        run: |
          curl -fL -o ci/lib/jakarta.mail-api.jar \
            https://repo1.maven.org/maven2/jakarta/mail/jakarta.mail-api/2.1.3/jakarta.mail-api-2.1.3.jar

          curl -fL -o ci/lib/jakarta.activation-api.jar \
            https://repo1.maven.org/maven2/jakarta/activation/jakarta.activation-api/2.1.3/jakarta.activation-api-2.1.3.jar

          curl -fL -o ci/lib/angus-mail.jar \
            https://repo1.maven.org/maven2/org/eclipse/angus/angus-mail/2.0.4/angus-mail-2.0.4.jar

          curl -fL -o ci/lib/angus-activation.jar \
            https://repo1.maven.org/maven2/org/eclipse/angus/angus-activation/2.0.2/angus-activation-2.0.2.jar

      # 7. Download MySQL Connector
      - name: Download MySQL Connector
        run: |
          curl -fL -o ci/lib/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.4.0/mysql-connector-j-9.4.0.jar

      # 8. Show downloaded libraries
      - name: Verify CI libraries
        run: |
          echo "CI libraries:"
          ls -lh ci/lib

      # 9. Compile application
      - name: Compile Java source
        run: |
          mkdir -p build/classes

          find src/main/java -name "*.java" > sources.txt

          javac \
            -cp "ci/lib/*" \
            -d build/classes \
            @sources.txt

      # 10. Download JUnit 5
      - name: Download JUnit 5 Console Launcher
        run: |
          curl -fL -o ci/lib/junit-platform-console-standalone.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar

      # 11. Compile tests
      - name: Compile JUnit tests
        run: |
          mkdir -p build/test-classes

          find src/test/java -name "*.java" > test-sources.txt

          javac \
            -cp "build/classes:ci/lib/*" \
            -d build/test-classes \
            @test-sources.txt

      # 12. Run service tests
      - name: Run automated service tests
        run: |
          java -jar ci/lib/junit-platform-console-standalone.jar execute \
            --class-path "build/classes:build/test-classes:ci/lib/*" \
            --select-package com.sunrise.test.service

      # 13. Prepare WAR directory
      - name: Prepare WAR
        run: |
          mkdir -p build/war/WEB-INF/classes
          mkdir -p build/war/WEB-INF/lib

          cp -r src/main/webapp/* build/war/

          cp -r build/classes/* build/war/WEB-INF/classes/

      # 14. Add application libraries to WAR
      - name: Add application libraries to WAR
        run: |
          cp ci/lib/jakarta.mail-api.jar build/war/WEB-INF/lib/
          cp ci/lib/jakarta.activation-api.jar build/war/WEB-INF/lib/
          cp ci/lib/angus-mail.jar build/war/WEB-INF/lib/
          cp ci/lib/angus-activation.jar build/war/WEB-INF/lib/
          cp ci/lib/mysql-connector-j.jar build/war/WEB-INF/lib/

      # 15. Build WAR
      - name: Build WAR package
        run: |
          cd build/war
          jar -cvf ../SunriseDentalClinic.war .

      # 16. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseDentalClinic-WAR
          path: build/SunriseDentalClinic.war