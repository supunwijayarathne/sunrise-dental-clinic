name: Sunrise Dental Clinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check Java version
        run: java -version

      - name: Download Jakarta Servlet API
        run: |
          mkdir -p ci/lib
          curl -L -o ci/lib/jakarta-servlet-api.jar \
            https://repo1.maven.org/maven2/jakarta/servlet/jakarta.servlet-api/6.0.0/jakarta.servlet-api-6.0.0.jar

      - name: Compile Java source
        run: |
          mkdir -p build/classes
          find src/main/java -name "*.java" > sources.txt
          javac -cp "ci/lib/jakarta-servlet-api.jar:src/main/webapp/WEB-INF/lib/*" \
            -d build/classes \
            @sources.txt